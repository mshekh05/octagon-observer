# Homelab stack.
#   docker compose up -d                 -> app on :8000 (expose via Cloudflare Tunnel or Tailscale)
#   docker compose run --rm cli doctor   -> health check of keys and sources
#   docker compose run --rm cli report   -> reports/ufc-333.html (Phase-0 report)
x-app: &app
  build: .
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://octagon:${POSTGRES_PASSWORD:-octagon}@db:5432/octagon
  volumes: ["./data:/app/data", "./reports:/app/reports"]
  depends_on:
    db: { condition: service_healthy }
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: octagon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-octagon}
      POSTGRES_DB: octagon
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U octagon"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  api:
    <<: *app
    ports: ["8000:8000"]

  worker:
    <<: *app
    command: ["python", "-m", "octagon_edge.worker"]

  cli:
    <<: *app
    entrypoint: ["octagon-edge"]
    profiles: ["tools"]
    restart: "no"

  # Optional self-hosted ntfy (subscribe to your topic in the ntfy Android app).
  ntfy:
    image: binwiederhier/ntfy:v2.11.0
    command: serve
    ports: ["8090:80"]
    volumes: ["./data/ntfy:/var/cache/ntfy"]
    restart: unless-stopped
    profiles: ["ntfy"]

volumes:
  pgdata:
